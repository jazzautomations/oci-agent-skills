[project]
name = "oci-readonly-mcp"
version = "0.1.0"
description = "Scoped, bounded OCI inventory and cost tools over MCP stdio"
requires-python = ">=3.13"
dependencies = ["mcp==1.30.0", "oci==2.185.1", "oracle-mcp-common==0.1.3"]

[project.scripts]
oci-readonly-mcp = "oci_readonly.server:main"
oci-readonly-smoke = "oci_readonly.smoke:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oci_readonly"]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.5"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel.force-include]
"../scripts/lib/sanitize.py" = "oci_readonly/sanitize.py"
