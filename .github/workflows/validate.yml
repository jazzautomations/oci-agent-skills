name: Foundation validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.4'
      - run: python -m pip install oci-cli==3.91.0
      - run: uv run --frozen --project runtime pytest -q tests
      - run: uv run --frozen --project runtime python scripts/ci/check_frontmatter.py --baseline catalog/validation-baseline.json
      - run: uv run --frozen --project runtime python scripts/ci/check_refs.py --baseline catalog/validation-baseline.json
      - run: uv run --frozen --project runtime python scripts/ci/lint_fences.py --live-help
      - run: uv run --frozen --project runtime python scripts/ci/check_no_secrets.py
      - run: python scripts/inventory.py --format jsonl --index --check
      - run: uv run --frozen --project runtime oci-readonly-smoke
      - run: uv run --frozen --project runtime python scripts/ci/check_portable.py --baseline catalog/validation-baseline.json
      - run: uv run --frozen --project runtime python scripts/ci/check_budget.py --baseline catalog/validation-baseline.json
      - run: uv run --frozen --project runtime python scripts/ci/check_licenses.py --baseline catalog/validation-baseline.json
      - run: uv run --frozen --project runtime python scripts/ci/check_scripts_readonly.py
      - run: python scripts/inventory.py --scripts --examples --check
