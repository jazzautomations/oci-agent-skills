name: V2 validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.4'
      - run: python -m pip install oci-cli==3.91.0
      - run: uv run --frozen --project runtime pytest -q tests skills/oci-incident-triage/tests skills/oci-security-posture/tests skills/oci-sdk-patterns/tests
      - run: uv run --frozen --project runtime python scripts/ci/check_frontmatter.py
      - run: uv run --frozen --project runtime python scripts/ci/check_refs.py
      - run: uv run --frozen --project runtime python scripts/doc-gen/catalogs.py --check
      - run: uv run --frozen --project runtime python scripts/ci/lint_fences.py --live-help
      - run: uv run --frozen --project runtime python scripts/ci/check_no_secrets.py
      - run: uv run --frozen --project runtime python scripts/ci/check_history.py
      - run: python scripts/inventory.py --format jsonl --index --check
      - name: Verify offline read-option contracts against pinned CLI
        run: python scripts/generate_read_contracts.py --check
      - run: uv run --frozen --project runtime oci-readonly-smoke
      - run: uv run --frozen --project runtime python scripts/ci/check_portable.py
      - run: uv run --frozen --project runtime python scripts/ci/check_budget.py
      - run: uv run --frozen --project runtime python scripts/ci/check_licenses.py
      - run: uv run --frozen --project runtime python scripts/ci/check_scripts_readonly.py
      - run: uv run --frozen --project runtime python scripts/ci/check_template.py
      - run: python scripts/inventory.py --scripts --examples --check
      - run: python scripts/ci/check_manifests.py
      - run: python scripts/check_examples.py
      - run: uv run --frozen --project runtime python evals/run_routing.py --negatives
      - name: Component gates and recorded semantic evidence
        run: uv run --frozen --project runtime python scripts/eval/run.py --json /tmp/oci-offline-evaluation.json
      - name: Verify per-case routing diagnostics
        run: uv run --frozen --project runtime python scripts/eval/routing_diagnostics.py --check evals/results/routing-diagnostics.json
      - name: Verify recorded four-arm task evidence (no model calls)
        run: uv run --frozen --project runtime python scripts/eval/verify_tool_task_benchmark.py evals/results/tool-task-benchmark-structured-2026-09-11.json
      - name: Verify recorded native task evidence (no model calls)
        run: uv run --frozen --project runtime python scripts/eval/verify_native_task_benchmark.py evals/results/native-task-benchmark-2026-09-11.json
      - name: Recompute recorded command syntax audit (no commands executed)
        run: python scripts/eval/verify_native_command_audit.py evals/results/native-task-benchmark-2026-09-11.json evals/results/native-command-audit-2026-09-11.json
      - name: Verify reference-enabled paired evidence (no model calls)
        run: uv run --frozen --project runtime python scripts/eval/verify_native_reference_benchmark.py evals/results/native-reference-benchmark-2026-09-11.json
      - name: Recompute reference-enabled command audit (no commands executed)
        run: python scripts/eval/verify_native_command_audit.py evals/results/native-reference-benchmark-2026-09-11.json evals/results/native-reference-command-audit-2026-09-11.json
      - name: Verify checked-task evidence (no model or OCI calls)
        run: uv run --frozen --project runtime python scripts/eval/verify_checked_task_benchmark.py evals/results/checked-task-benchmark-2026-09-11.json
      - name: Verify current five-case repair regression (not full certification)
        run: uv run --frozen --project runtime python scripts/eval/task_repair_regression.py --report evals/results/task-repair-regression-2026-09-11.json
      - name: Recompute checked-task syntax audit (not the workflow score)
        run: python scripts/eval/verify_native_command_audit.py evals/results/checked-task-benchmark-2026-09-11.json evals/results/checked-task-command-audit-2026-09-11.json
      - name: Preserve evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation
          path: /tmp/oci-offline-evaluation.json
          if-no-files-found: ignore
