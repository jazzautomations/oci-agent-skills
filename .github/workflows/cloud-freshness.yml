name: Cloud source freshness
on:
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare official public sources with reviewed baseline
        run: python scripts/ci/check_cloud_freshness.py --out cloud-freshness-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-freshness-report
          path: cloud-freshness-report.json
