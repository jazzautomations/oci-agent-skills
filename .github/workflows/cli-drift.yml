name: Weekly CLI drift
on:
  schedule:
    - cron: '17 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install oci-cli==3.91.0
      - run: python scripts/ci/cli_drift.py > /tmp/pinned.tsv
      - run: python -m pip install --upgrade oci-cli
      - run: python scripts/ci/cli_drift.py > /tmp/current.tsv
      - name: Compare required flags
        run: diff -u /tmp/pinned.tsv /tmp/current.tsv > cli-drift.diff || test "$?" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: cli-drift
          path: cli-drift.diff
      - name: Open drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s cli-drift.diff; then
            gh issue list --search 'CLI required-flag drift in:title' --state open --json number > /tmp/issues.json
            if test "$(python -c 'import json; print(len(json.load(open("/tmp/issues.json"))))')" = 0; then
              gh issue create --title 'CLI required-flag drift' --body-file cli-drift.diff
            fi
          fi
