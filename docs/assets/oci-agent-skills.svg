<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">OCI Agent Skills</title>
  <desc id="desc">Oracle cloud engineering for coding agents. 37 focused skills, 15 read-only MCP tools, and a searchable CLI catalog. Independent community project.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#DAD5CA" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="12" fill="#F6F3EC"/>
  <rect x="768" width="512" height="360" fill="url(#grid)"/>
  <rect x="0" width="8" height="360" rx="4" fill="#C74634"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="54" fill="#765D50" font-size="12" font-weight="700" letter-spacing="3">INDEPENDENT · COMMUNITY BUILT</text>
    <text x="48" y="132" fill="#242A29" font-size="62" font-weight="700" letter-spacing="-2">OCI Agent Skills</text>
    <text x="52" y="179" fill="#4A5753" font-size="25">Oracle cloud engineering for coding agents.</text>
    <path d="M52 215 H700" stroke="#D4CFC4"/>
    <text x="52" y="266" fill="#C74634" font-size="35" font-weight="700">37</text>
    <text x="108" y="265" fill="#4A5753" font-size="16">focused skills</text>
    <text x="282" y="266" fill="#C74634" font-size="35" font-weight="700">15</text>
    <text x="338" y="265" fill="#4A5753" font-size="16">read-only MCP tools</text>
    <text x="52" y="319" fill="#765D50" font-size="13">Scoped workflows · Searchable commands · Reproducible evidence</text>
    <g transform="translate(820 62)">
      <rect width="396" height="236" rx="10" fill="#263732"/>
      <path d="M0 40 H396" stroke="#486059"/>
      <circle cx="22" cy="20" r="4" fill="#D77362"/>
      <circle cx="38" cy="20" r="4" fill="#C8BA94"/>
      <circle cx="54" cy="20" r="4" fill="#84A893"/>
      <text x="80" y="24" fill="#CDDBD2" font-size="11" letter-spacing="1">SCOPE → INSPECT → REVIEW</text>
      <g font-family="Consolas, 'Liberation Mono', monospace" font-size="15">
        <text x="24" y="79" fill="#A5C6B1">$ choose a workflow</text>
        <text x="40" y="111" fill="#F6F3EC">Infrastructure · Database · AI</text>
        <text x="24" y="153" fill="#A5C6B1">$ inspect the evidence</text>
        <text x="40" y="185" fill="#F6F3EC">Skills + CLI catalog + MCP</text>
      </g>
      <rect x="24" y="208" width="54" height="4" rx="2" fill="#D77362"/>
      <rect x="84" y="208" width="142" height="4" rx="2" fill="#486059"/>
    </g>
  </g>
</svg>
